<title>SowiMotor — Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  /* live-mode wrapper — scales the 1280-wide design to any viewport */
  html, body { background: #0d0d10; min-height: 100vh; }
  .live-wrap {
    width: 100%;
    overflow-x: hidden;
    background: #0d0d10;
  }
  .live-stage {
    width: 1280px;
    margin: 0 auto;
    transform-origin: top center;
  }
  .live-stage .wf {
    width: 1280px;
    height: auto !important; /* let content drive height in live mode */
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
  }
  /* responsive scale-down for narrow viewports */
  @media (max-width: 1320px) {
    .live-stage { transform: scale(calc(100vw / 1280)); width: 1280px; }
    .live-wrap { height: auto; }
  }
  /* clickable affordances */
  .nav-links span { cursor: pointer; transition: color 0.15s; }
  .nav-links span:hover { color: var(--accent); }
  .btn, .card, .nav-logo, .filter-chip, .chip-wa { cursor: pointer; }
  .btn { transition: transform 0.1s, background 0.15s; }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
  .card { transition: transform 0.15s; }
  .card:hover { transform: translateY(-2px); }

  /* floating lang switch — top-right, always visible */
  .live-lang {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    display: inline-flex; border: 2px solid var(--accent);
    background: rgba(13,13,16,0.9);
    backdrop-filter: blur(8px);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700; letter-spacing: 0.06em;
  }
  .live-lang button {
    padding: 8px 14px; border: 0; background: transparent;
    color: #ededea; cursor: pointer; font: inherit; font-size: 12px;
  }
  .live-lang button.on { background: var(--accent); color: #0d0d10; }
</style>
</head>
<body>
<div id="root"></div>
